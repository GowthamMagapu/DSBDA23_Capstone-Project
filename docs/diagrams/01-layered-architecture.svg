<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 950" width="1240" height="950" role="img" aria-label="Layered architecture of AgentU: browser clients pass through Next.js middleware to seventeen route handlers, which call a service layer that reaches MySQL through Prisma and calls Gemini, LinkedIn and SMTP over the network.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1d23"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b1500f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="950" fill="#ffffff"/>

  <text x="40" y="38" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1a1d23">AgentU — Layered Architecture</text>
  <text x="40" y="60" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Next.js 15 App Router · 17 route handlers · 15-module service layer · Prisma 7 over MariaDB · three external services</text>

  <!-- ================= Band 1: Client ================= -->
  <rect x="40" y="80" width="920" height="120" rx="10" fill="#f7f9fb" stroke="#dde3ea"/>
  <text x="56" y="103" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6472" letter-spacing="0.6">CLIENT (BROWSER)</text>

  <rect x="56" y="114" width="211" height="70" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="68" y="135" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">/careers/[slug]</text>
  <text x="68" y="153" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">public job page (RSC)</text>
  <text x="68" y="169" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">+ CareersClient island</text>

  <rect x="281" y="114" width="211" height="70" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="293" y="135" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">/jobs/[jobId]/apply</text>
  <text x="293" y="153" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">candidate form,</text>
  <text x="293" y="169" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">multipart resume upload</text>

  <rect x="506" y="114" width="211" height="70" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="518" y="135" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">/dashboard</text>
  <text x="518" y="153" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">recruiter console; feed</text>
  <text x="518" y="169" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">polls events every 5s</text>

  <rect x="731" y="114" width="211" height="70" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="743" y="135" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">/auth/*</text>
  <text x="743" y="153" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">sign in, sign up,</text>
  <text x="743" y="169" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">forgot / reset password</text>

  <line x1="500" y1="200" x2="500" y2="236" stroke="#1a1d23" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="512" y="223" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">HTTPS request</text>

  <!-- ================= Band 2: Middleware ================= -->
  <rect x="40" y="240" width="920" height="78" rx="10" fill="#f7f9fb" stroke="#dde3ea"/>
  <text x="56" y="263" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6472" letter-spacing="0.6">REQUEST GATE</text>
  <text x="56" y="288" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">src/middleware.ts</text>
  <text x="196" y="288" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">runtime = &apos;nodejs&apos; · NextAuth v5 JWT session check</text>
  <text x="56" y="306" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">matcher: / , /auth/:path* , /dashboard/:path* — signed-in users are redirected off /auth, anonymous users off /dashboard</text>

  <line x1="500" y1="318" x2="500" y2="354" stroke="#1a1d23" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="512" y="341" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">session-checked request</text>

  <!-- ================= Band 3: Route handlers ================= -->
  <rect x="40" y="358" width="920" height="150" rx="10" fill="#f7f9fb" stroke="#dde3ea"/>
  <text x="56" y="381" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6472" letter-spacing="0.6">ROUTE HANDLERS — src/app/api (17 routes)</text>

  <rect x="56" y="392" width="168" height="98" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="66" y="412" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">/api/auth/*</text>
  <text x="66" y="431" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">[...nextauth]</text>
  <text x="66" y="447" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">signup</text>
  <text x="66" y="463" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">forgot-password</text>
  <text x="66" y="479" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">reset-password</text>

  <rect x="236" y="392" width="168" height="98" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="246" y="412" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">/api/jobs</text>
  <text x="246" y="431" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">GET list · POST publish</text>
  <text x="246" y="447" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">[jobId] detail</text>
  <text x="246" y="463" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">[jobId]/analysis</text>
  <text x="246" y="479" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">[jobId]/linkedin retry</text>

  <rect x="416" y="392" width="168" height="98" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="426" y="412" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">…/applications</text>
  <text x="426" y="431" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">POST apply (public)</text>
  <text x="426" y="447" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">GET ranked list</text>
  <text x="426" y="463" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">export (CSV)</text>
  <text x="426" y="479" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">[id]/resume download</text>

  <rect x="596" y="392" width="168" height="98" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="606" y="412" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">/api/company</text>
  <text x="606" y="431" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">company profile</text>
  <text x="606" y="447" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">(brief for every prompt)</text>
  <text x="606" y="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">/api/careers/[slug]</text>
  <text x="606" y="486" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">public listing JSON</text>

  <rect x="776" y="392" width="168" height="98" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="786" y="412" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">/api/linkedin/*</text>
  <text x="786" y="431" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">connect · callback</text>
  <text x="786" y="447" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">connection status</text>
  <text x="786" y="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">/api/agent/events</text>
  <text x="786" y="486" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">feed cursor (?since)</text>

  <line x1="500" y1="508" x2="500" y2="544" stroke="#1a1d23" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="512" y="531" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">Zod-validated input + owner check</text>

  <!-- ================= Band 4: Services ================= -->
  <rect x="40" y="548" width="920" height="170" rx="10" fill="#f7f9fb" stroke="#dde3ea"/>
  <text x="56" y="571" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6472" letter-spacing="0.6">SERVICE LAYER — src/lib</text>

  <rect x="56" y="582" width="211" height="60" rx="7" fill="#fdf6f1" stroke="#e0b49a"/>
  <text x="66" y="602" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">job-listing · company</text>
  <text x="66" y="620" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">company brief → listing,</text>
  <text x="66" y="635" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">headline, tags; slug</text>

  <rect x="281" y="582" width="211" height="60" rx="7" fill="#fdf6f1" stroke="#e0b49a"/>
  <text x="291" y="602" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">application-analysis</text>
  <text x="291" y="620" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">score, status, skills;</text>
  <text x="291" y="635" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">keyword fallback on error</text>

  <rect x="506" y="582" width="211" height="60" rx="7" fill="#fdf6f1" stroke="#e0b49a"/>
  <text x="516" y="602" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">gemini</text>
  <text x="516" y="620" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">JSON response mode,</text>
  <text x="516" y="635" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">temp 0.2, 30s timeout</text>

  <rect x="731" y="582" width="211" height="60" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="741" y="602" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">linkedin · secret-box</text>
  <text x="741" y="620" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">OAuth 2.0, UGC post;</text>
  <text x="741" y="635" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">AES-256-GCM at rest</text>

  <rect x="56" y="650" width="211" height="58" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="66" y="670" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">agent-events</text>
  <text x="66" y="688" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">append-only step log;</text>
  <text x="66" y="702" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">failures never propagate</text>

  <rect x="281" y="650" width="211" height="58" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="291" y="670" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">notifications · email</text>
  <text x="291" y="688" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">recruiter mail; every send</text>
  <text x="291" y="702" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">mirrored into the feed</text>

  <rect x="506" y="650" width="211" height="58" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="516" y="670" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">resume-text · resume-file</text>
  <text x="516" y="688" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">pdf-parse, mammoth,</text>
  <text x="516" y="702" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">extension allowlist</text>

  <rect x="731" y="650" width="211" height="58" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="741" y="670" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">rate-limit · auth · app-url</text>
  <text x="741" y="688" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">in-memory fixed window,</text>
  <text x="741" y="702" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">JWT sessions, public URLs</text>

  <line x1="500" y1="718" x2="500" y2="754" stroke="#1a1d23" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="512" y="741" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">Prisma queries (typed)</text>

  <!-- ================= Band 5: Data ================= -->
  <rect x="40" y="758" width="920" height="105" rx="10" fill="#f7f9fb" stroke="#dde3ea"/>
  <text x="56" y="781" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6472" letter-spacing="0.6">DATA ACCESS &amp; PERSISTENCE</text>

  <rect x="56" y="792" width="286" height="56" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="66" y="813" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">Prisma Client 7</text>
  <text x="66" y="833" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">singleton cached on globalThis in dev</text>

  <rect x="356" y="792" width="286" height="56" rx="7" fill="#ffffff" stroke="#c8d0da"/>
  <text x="366" y="813" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">PrismaMariaDb driver adapter</text>
  <text x="366" y="833" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">connectionLimit 5 · parsed DATABASE_URL</text>

  <rect x="656" y="792" width="286" height="56" rx="7" fill="#eef3fa" stroke="#9db6d6"/>
  <text x="666" y="813" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">MySQL / MariaDB</text>
  <text x="666" y="833" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">10 models · resumes as LongBlob</text>

  <!-- ================= External column ================= -->
  <rect x="990" y="358" width="210" height="360" rx="10" fill="#fbf7f4" stroke="#e0cdbe"/>
  <text x="1006" y="381" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8a5a36" letter-spacing="0.6">EXTERNAL SERVICES</text>

  <rect x="1006" y="394" width="178" height="62" rx="7" fill="#ffffff" stroke="#d8a97f"/>
  <text x="1016" y="414" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">Google Gemini</text>
  <text x="1016" y="431" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">generateContent REST</text>
  <text x="1016" y="447" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">listing + screening</text>

  <rect x="1006" y="466" width="178" height="62" rx="7" fill="#ffffff" stroke="#d8a97f"/>
  <text x="1016" y="486" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">LinkedIn API</text>
  <text x="1016" y="503" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">OpenID Connect +</text>
  <text x="1016" y="519" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">w_member_social post</text>

  <rect x="1006" y="538" width="178" height="62" rx="7" fill="#ffffff" stroke="#d8a97f"/>
  <text x="1016" y="558" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">SMTP</text>
  <text x="1016" y="575" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">nodemailer; recruiter</text>
  <text x="1016" y="591" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">notification mail</text>

  <rect x="1006" y="610" width="178" height="62" rx="7" fill="#ffffff" stroke="#d8a97f"/>
  <text x="1016" y="630" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1d23">Google OAuth</text>
  <text x="1016" y="647" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">optional sign-in</text>
  <text x="1016" y="663" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472">provider</text>

  <path d="M 960 612 L 986 612" stroke="#b1500f" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
  <text x="966" y="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8a5a36" transform="rotate(-90 966 700)">outbound, server-side only</text>

  <!-- ================= Resilience note ================= -->
  <rect x="40" y="884" width="1160" height="46" rx="8" fill="#f7f9fb" stroke="#dde3ea"/>
  <text x="56" y="903" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6472">GRACEFUL DEGRADATION —</text>
  <text x="240" y="903" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1d23">every external dependency has a documented fallback, so no single outage stops a recruiter publishing or a candidate applying.</text>
  <text x="56" y="921" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6472">Gemini down → keyword-overlap scoring and a template listing · LinkedIn unconnected → post skipped, retryable from the job card · SMTP unset → send skipped and logged to the feed</text>
</svg>
